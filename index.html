<style>
:root{
  --bg: #FFF8F0;
  --card: #FFFFFF;
  --ink: #3E332C;
  --ink-soft: #8A7D72;
  --accent: #FF945A;
  --accent-soft: #FFE4D5;
  --line: #F0E4D8;
  --rankA: #E85D5D;
  --rankA-bg: #FDE7E7;
  --rankB: #F0A93E;
  --rankB-bg: #FCF0DA;
  --rankC: #4CAF87;
  --rankC-bg: #E3F5EC;
  --rankD: #6C8CB0;
  --rankD-bg: #E7EEF5;
  --rankP: #8B6FD1;
  --rankP-bg: #EDE7FA;
  --shadow: 0 4px 14px rgba(62,51,44,0.08);
}
*{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
body{
  margin:0;
  font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
  background: var(--bg);
  color: var(--ink);
  padding-bottom: 90px;
}
header{
  background: linear-gradient(135deg, var(--accent), #FFB27A);
  color: #fff;
  padding: 18px 16px 16px;
  box-shadow: var(--shadow);
}
header h1{ margin:0; font-size: 19px; font-weight:800; letter-spacing:.02em; display:flex; align-items:center; gap:8px;}
.status-row{ display:flex; justify-content:space-between; align-items:center; margin-top:10px; gap:10px; }
.level-chip{
  background: rgba(255,255,255,0.22);
  border-radius: 20px;
  padding: 6px 12px;
  font-size: 12px;
  font-weight:700;
  display:flex; align-items:center; gap:6px;
}
.streak-chip{
  background: rgba(255,255,255,0.22);
  border-radius: 20px;
  padding: 6px 12px;
  font-size: 12px;
  font-weight:700;
}
.xp-bar-wrap{
  margin-top:10px; background: rgba(255,255,255,0.25); border-radius: 10px; height:10px; overflow:hidden;
}
.xp-bar{ height:100%; background:#fff; border-radius:10px; transition: width .5s ease; }
.xp-label{ font-size:11px; margin-top:4px; opacity:.9; }

nav.tabs{
  display:flex; background:#fff; position:sticky; top: 0; z-index:50;
  border-bottom:1px solid var(--line); overflow-x:auto;
}
nav.tabs button{
  flex:1; min-width:80px; border:none; background:none; padding:12px 6px; font-size:13px;
  font-weight:700; color: var(--ink-soft); cursor:pointer; border-bottom: 3px solid transparent;
  white-space:nowrap;
}
nav.tabs button.active{ color: var(--accent); border-bottom-color: var(--accent); }

main{ padding: 14px; max-width: 900px; margin:0 auto; }
.section{ display:none; }
.section.active{ display:block; }

.card{
  background: var(--card);
  border-radius: 16px;
  padding: 14px;
  box-shadow: var(--shadow);
  margin-bottom: 12px;
}

.encourage-banner{
  background: linear-gradient(135deg, #FFF0E4, #FFE4D5);
  border-radius: 16px;
  padding: 14px 16px;
  margin-bottom: 14px;
  font-size: 14px;
  font-weight:700;
  color:#8A4B1F;
  display:flex; align-items:center; gap:10px;
}
.encourage-banner .emoji{ font-size:24px; }

.day-progress{
  display:flex; align-items:center; gap:10px; margin-bottom: 4px;
}
.day-progress .ring{
  width:52px; height:52px; border-radius:50%; flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:800; color:var(--accent);
  background: conic-gradient(var(--accent) calc(var(--pct,0)*1%), var(--line) 0);
}
.day-progress .ring::before{
  content:""; position:absolute;
}
.day-progress .ring span{ background:#fff; width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; }

/* Task list */
.date-group-header{
  display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:800; color: var(--ink-soft);
  padding:12px 4px 6px; border-bottom:1px solid var(--line); margin-bottom:2px;
}
.date-group-header:first-child{ padding-top:4px; }
.date-group-header .badge-today{ background: var(--accent); color:#fff; border-radius:10px; padding:1px 8px; font-size:11px; }
.date-group-header .badge-tomorrow{ background: var(--accent-soft); color: var(--accent); border-radius:10px; padding:1px 8px; font-size:11px; }
.date-group-header .badge-overdue{ background:#FDE7E7; color: var(--rankA); border-radius:10px; padding:1px 8px; font-size:11px; }
.task-row{
  display:flex; align-items:center; gap:10px; padding:10px 8px; border-bottom:1px solid var(--line); cursor:pointer;
}
.task-row:last-child{ border-bottom:none; }
.task-row.row-undated{ background: #F5F1FC; border-radius:10px; margin-bottom:2px; }
.task-row.row-overdue{ background: #FFF0EE; border-radius:10px; margin-bottom:2px; }
.task-row.row-inprogress{ background: #FFF7E0; border-radius:10px; margin-bottom:2px; }
.task-row.row-cancelled{ background: #F1F1F1; border-radius:10px; margin-bottom:2px; opacity:0.75; }
.rank-badge{
  width:30px; height:30px; border-radius:9px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
  font-weight:800; font-size:14px;
}
.task-main{ flex:1; min-width:0; }
.task-name{ font-weight:700; font-size:14.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.task-name.done{ text-decoration: line-through; color: var(--ink-soft); }
.task-name.cancelled{ text-decoration: line-through; color: #A39B92; }
.task-meta{ font-size:11.5px; color: var(--ink-soft); margin-top:2px; }
.task-memo{ font-size:11.5px; color: var(--ink-soft); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.task-memo a{ color: var(--accent); text-decoration:underline; }
.task-actions{ display:flex; gap:6px; flex-shrink:0; }
.icon-btn{
  border:none; background: var(--accent-soft); color:var(--accent); width:32px; height:32px; border-radius:9px;
  font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center;
}
.icon-btn.done-btn{ background:#E3F5EC; color: var(--rankC); }
.icon-btn.start-btn{ background:#FFF0DC; color: var(--rankB); }
.icon-btn.cancel-btn{ background:#F1F1F1; color:#8A7D72; }
.icon-btn.resume-btn{ background:#E7EEF5; color: var(--rankD); }
.icon-btn.del-btn{ background:#FDE7E7; color: var(--rankA); }

.fab{
  position:fixed; right:20px; bottom:24px; width:58px; height:58px; border-radius:50%;
  background: var(--accent); color:#fff; border:none; font-size:28px; box-shadow: 0 6px 18px rgba(255,148,90,0.5);
  cursor:pointer; z-index:60; display:flex; align-items:center; justify-content:center;
}

/* Modal */
.overlay{
  position:fixed; inset:0; background:rgba(62,51,44,0.4); display:none; align-items:flex-end; justify-content:center; z-index:100;
}
.overlay.show{ display:flex; }
.modal{
  background:#fff; width:100%; max-width:520px; border-radius: 20px 20px 0 0; padding:20px; max-height:88vh; overflow-y:auto;
  animation: slideup .25s ease;
}
@keyframes slideup{ from{ transform:translateY(30px); opacity:0;} to{ transform:translateY(0); opacity:1;} }
.modal h2{ margin:0 0 14px; font-size:17px; }
.field{ margin-bottom:12px; }
.field label{ display:block; font-size:12.5px; font-weight:700; color: var(--ink-soft); margin-bottom:5px; }
.field input, .field select, .field textarea{
  width:100%; padding:10px 12px; border-radius:10px; border:1.5px solid var(--line); font-size:14px; font-family:inherit; background:#FFFBF7;
}
.rank-select{ display:flex; gap:8px; }
.weekday-select{ display:flex; gap:5px; flex-wrap:nowrap; }
.weekday-select label{ flex:1; text-align:center; padding:9px 0; border-radius:9px; border:1.5px solid var(--line); font-weight:800; cursor:pointer; font-size:13px; margin:0; color: var(--ink-soft); }
.weekday-select input{ display:none; }
.weekday-select label.active{ background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.rank-select label{ flex:1; text-align:center; padding:10px 0; border-radius:10px; border:1.5px solid var(--line); font-weight:800; cursor:pointer; font-size:14px; margin:0; color: var(--ink-soft);}
.rank-select input{ display:none; }
.rank-select input:checked + span{ }
.rank-select .opt{ display:block; }
.rank-select label.rA.active{ background: var(--rankA-bg); border-color: var(--rankA); color: var(--rankA); }
.rank-select label.rB.active{ background: var(--rankB-bg); border-color: var(--rankB); color: var(--rankB); }
.rank-select label.rC.active{ background: var(--rankC-bg); border-color: var(--rankC); color: var(--rankC); }
.rank-select label.rD.active{ background: var(--rankD-bg); border-color: var(--rankD); color: var(--rankD); }
.rank-select label.rP.active{ background: var(--rankP-bg); border-color: var(--rankP); color: var(--rankP); }
.rank-select label.catWork.active{ background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.rank-select label.catPrivate.active{ background: var(--rankP-bg); border-color: var(--rankP); color: var(--rankP); }
.rank-select label.dmTime.active{ background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.rank-select label.dmDate.active{ background: #E3F5EC; border-color: var(--rankC); color: var(--rankC); }
.rank-select label.dmNone.active{ background: #F5F1FC; border-color: var(--rankP); color: var(--rankP); }
.row2{ display:flex; gap:10px; }
.row2 .field{ flex:1; }
.modal-actions{ display:flex; gap:10px; margin-top:16px; }
.btn{ flex:1; padding:13px; border-radius:12px; border:none; font-weight:800; font-size:15px; cursor:pointer; }
.btn.primary{ background: var(--accent); color:#fff; }
.btn.secondary{ background: var(--line); color: var(--ink-soft); }

/* Gantt */
.gantt-wrap{ display:flex; }
.gantt-names-col{ flex-shrink:0; width:110px; }
.gantt-names-header{ height:14px; padding-bottom:6px; margin-bottom:4px; border-bottom:2px solid var(--line); box-sizing:content-box; }
.gantt-name-row{
  height:34px; display:flex; align-items:center; font-size:12.5px; font-weight:700;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding-right:6px; border-bottom:1px solid var(--line);
}
.gantt-name-row:last-child{ border-bottom:none; }
.gantt-scroll-area{ flex:1; min-width:0; overflow-x:auto; }
.gantt-timeline{ display:flex; min-width:480px; border-bottom:2px solid var(--line); padding-bottom:6px; margin-bottom:4px; }
.gantt-hour{ flex:1; text-align:center; font-size:10px; color:var(--ink-soft); border-left:1px solid var(--line); }
.gantt-row{ display:flex; align-items:center; height:34px; border-bottom:1px solid var(--line); min-width:480px; }
.gantt-row:last-child{ border-bottom:none; }
.gantt-track{ flex:1; min-width:480px; position:relative; height:34px; background: repeating-linear-gradient(to right, transparent, transparent calc(100%/24 - 1px), var(--line) calc(100%/24 - 1px), var(--line) calc(100%/24)); border-radius:6px; }
.bar{ position:absolute; height:11px; border-radius:6px; top:2px; }
.bar.actual{ top:18px; }
.bar-plan{ opacity:0.45; border:1.5px dashed; background:transparent !important; }

.empty-hint{ text-align:center; color: var(--ink-soft); font-size:13px; padding:30px 10px; }

/* Achievements */
.badge-grid{ display:grid; grid-template-columns: repeat(3,1fr); gap:10px; }
.badge{ background:#fff; border-radius:14px; padding:12px 6px; text-align:center; box-shadow: var(--shadow); opacity:0.35; }
.badge.unlocked{ opacity:1; }
.badge .b-emoji{ font-size:26px; }
.badge .b-name{ font-size:11px; font-weight:700; margin-top:4px; color: var(--ink-soft); }
.badge.unlocked .b-name{ color: var(--ink); }

.stat-grid{ display:grid; grid-template-columns: repeat(3,1fr); gap:10px; margin-bottom:14px; }
.stat-box{ background:#fff; border-radius:14px; padding:12px; text-align:center; box-shadow: var(--shadow); }
.stat-box .num{ font-size:20px; font-weight:800; color: var(--accent); }
.stat-box .lbl{ font-size:11px; color: var(--ink-soft); margin-top:2px; }

.confetti-canvas{ position:fixed; inset:0; pointer-events:none; z-index: 200; }

.filter-bar{ display:flex; gap:6px; margin-bottom:10px; overflow-x:auto; }
.filter-chip{ padding:6px 12px; border-radius:16px; background:#fff; border:1.5px solid var(--line); font-size:12px; font-weight:700; color:var(--ink-soft); white-space:nowrap; cursor:pointer; }
.filter-chip.active{ background: var(--accent); border-color:var(--accent); color:#fff; }

.section-title{ font-size:13px; font-weight:800; color: var(--ink-soft); margin: 4px 0 8px; }
</style>
</head>
<body>

<header>
  <h1>📊 やることガントチャート</h1>
  <div class="status-row">
    <div class="level-chip">⭐ Lv.<span id="levelNum">1</span></div>
    <div class="streak-chip">🔥 <span id="streakNum">0</span>日連続</div>
    <button id="notifyBtn" class="streak-chip" style="border:none; cursor:pointer; font-family:inherit;">🔔</button>
  </div>
  <div class="xp-bar-wrap"><div class="xp-bar" id="xpBar" style="width:0%"></div></div>
  <div class="xp-label"><span id="xpText">0 / 100 XP</span></div>
</header>

<nav class="tabs">
  <button class="tab-btn active" data-tab="list">📋 リスト</button>
  <button class="tab-btn" data-tab="gantt">📊 ガント</button>
  <button class="tab-btn" data-tab="achieve">🏆 達成状況</button>
</nav>

<main>

  <!-- リスト管理 -->
  <section class="section active" id="tab-list">
    <div class="encourage-banner" id="encourageBanner">
      <span class="emoji">✨</span>
      <span id="encourageText">今日も一日がんばりましょう！</span>
    </div>

    <div class="card">
      <div class="day-progress">
        <div class="ring" id="dayRing" style="--pct:0"><span id="dayPct">0%</span></div>
        <div style="flex:1">
          <div class="section-title" style="margin:0;">今日の達成率</div>
          <div style="font-size:12px; color:var(--ink-soft);"><span id="doneCount">0</span>/<span id="totalCount">0</span> 件完了</div>
        </div>
      </div>
    </div>

    <div class="filter-bar">
      <div class="filter-chip active" data-rank="ALL">すべて</div>
      <div class="filter-chip" data-rank="A">A</div>
      <div class="filter-chip" data-rank="B">B</div>
      <div class="filter-chip" data-rank="C">C</div>
      <div class="filter-chip" data-rank="D">📝 備忘</div>
      <div class="filter-chip" data-rank="P">🏠 プライベート</div>
    </div>

    <div style="display:flex; justify-content:flex-end; margin-bottom:8px;">
      <label style="display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; color:var(--ink-soft); cursor:pointer;">
        <input type="checkbox" id="showCompletedToggle" style="width:auto;">
        完了済みを表示
      </label>
    </div>

    <div class="card" id="taskListCard">
      <div class="empty-hint" id="emptyHint">やることがありません。右下の＋ボタンから追加しましょう。</div>
      <div id="taskList"></div>
    </div>
  </section>

  <!-- ガントチャート -->
  <section class="section" id="tab-gantt">

/* ---------- ユーティリティ ---------- */
function uid(){ return 't' + Date.now() + Math.floor(Math.random()*1000); }
function todayStr(){ return toLocalDateStr(new Date()); }
function toLocalDateStr(d){
  const pad = n => n.toString().padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function fmtTime(iso){
  if(!iso) return '--:--';
  const d = new Date(iso);
  return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}
function fmtDateOnly(dateStr){
  if(!dateStr) return '';
  const [y,m,d] = dateStr.split('-');
  return `${parseInt(m,10)}/${parseInt(d,10)}`;
}
function fmtDateTimeLocal(d){
  const pad = n => n.toString().padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function roundTo10Min(d){
  const rounded = new Date(d);
  rounded.setSeconds(0,0);
  rounded.setMinutes(Math.round(rounded.getMinutes()/10)*10);
  return rounded;
}
/* 直近の新規登録操作の記録（10分以内の連続登録判定に使用） */
let lastRegisteredAt = null;
let lastRegisteredPlanEnd = null;

function getDefaultStartTime(){
  const now = new Date();
  const withinTenMin = lastRegisteredAt && ((now - lastRegisteredAt) <= 10*60*1000);
  if (withinTenMin && lastRegisteredPlanEnd) {
    return new Date(lastRegisteredPlanEnd);
  }
  return roundTo10Min(new Date(now.getTime() + 60*60*1000));
}

/* ---------- 開始15分前通知 ---------- */
let scheduledNotifyTimers = {};
const notifyBtn = document.getElementById('notifyBtn');
function isIOSDevice(){ return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream; }
function isAndroidDevice(){ return /Android/.test(navigator.userAgent); }

function updateNotifyBtnLabel(){
  if (!('Notification' in window)) {
    notifyBtn.textContent = '🔕';
    notifyBtn.title = 'この端末・ブラウザは通知に対応していません';
    return;
  }
  if (Notification.permission === 'granted') {
    notifyBtn.textContent = '🔔 ON';
    notifyBtn.title = '開始15分前に通知します（タップで詳細）';
  } else if (Notification.permission === 'denied') {
    notifyBtn.textContent = '🔕 OFF';
    notifyBtn.title = '通知がブロックされています。ブラウザの設定から許可してください';
  } else {
    notifyBtn.textContent = '🔔 有効化';
    notifyBtn.title = 'タップして通知を許可すると、開始15分前にお知らせします';
  }
}

notifyBtn.addEventListener('click', () => {
  if (!('Notification' in window)) {
    if (isIOSDevice()) {
      alert('この端末では通知が利用できません。\n\niPhoneの場合：Safariで開いた画面右下の共有ボタン→「ホーム画面に追加」でアプリを追加し、ホーム画面のアイコンから開いた状態で再度お試しください（iOS 16.4以降が必要です）。');
    } else {
      alert('この端末・ブラウザは通知に対応していません。');
    }
    return;
  }
  if (Notification.permission === 'default') {
    Notification.requestPermission().then((result) => {
      updateNotifyBtnLabel();
      scheduleNotifications();
      if (result !== 'granted') {
        alert(deniedGuideMessage());
      }
    }).catch(() => {
      alert(deniedGuideMessage());
    });
  } else if (Notification.permission === 'granted') {
    alert('通知は有効です。予定開始の15分前にお知らせします。\n（このアプリを開いている間のみ通知されます）');
  } else {
    alert(deniedGuideMessage());
  }
});

/* 端末・ブラウザに応じた通知許可の案内文 */
function deniedGuideMessage(){
  if (isIOSDevice()) {
    return '通知が許可されませんでした。\niPhoneの場合は、ホーム画面に追加したアイコンから開いているかご確認ください（Safariのタブから開いている場合は通知を利用できません。iOS 16.4以降が必要です）。';
  }
  if (isAndroidDevice()) {
    return '通知がブロックされています。以下をご確認ください。\n\n① ブラウザのアドレスバー左側の鍵（またはℹ️）アイコン→「権限」→「通知」を「許可」に変更\n② Androidの「設定」→「アプリ」→ご利用中のブラウザ→「通知」がONになっているか確認\n\n上記を確認後、ページを再読み込みしてもう一度お試しください。';
  }
  return '通知がブロックされています。ブラウザ／端末の通知設定からこのサイトの通知を許可してください。設定変更後はページの再読み込みが必要な場合があります。';
}

function clearAllNotifyTimers(){
  Object.values(scheduledNotifyTimers).forEach(tid => clearTimeout(tid));
  scheduledNotifyTimers = {};
}

/* 予定開始15分前に通知をスケジュール（アプリを開いている間のみ有効） */
function scheduleNotifications(){
  clearAllNotifyTimers();
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const now = Date.now();
  const maxAheadMs = 24 * 60 * 60 * 1000; // 24時間先まで先読みしてスケジュール
  Object.entries(tasks).forEach(([id, t]) => {
    if (t.done || !t.planStart) return;
    const startMs = new Date(t.planStart).getTime();
    const notifyMs = startMs - 15 * 60 * 1000;
    const delay = notifyMs - now;
    if (delay > 0 && delay <= maxAheadMs) {
      scheduledNotifyTimers[id] = setTimeout(() => {
        fireNotification('もうすぐ開始です ⏰', `${t.name}（${fmtTime(t.planStart)} 開始）`);
      }, delay);
    }
  });
}

/* Service Worker経由（iOSで必須）を優先し、使えない場合は通常のNotificationにフォールバック */
function fireNotification(title, body){
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.ready.then(reg => {
      reg.showNotification(title, { body }).catch(() => fallbackNotify(title, body));
    }).catch(() => fallbackNotify(title, body));
  } else {
    fallbackNotify(title, body);
  }
}
function fallbackNotify(title, body){
  try { new Notification(title, { body }); } catch (e) { /* 通知生成に失敗した場合は無視 */ }
}

/* 曜日を取得するヘルパー：指定曜日の直近の日付（今日を含む）を返す */
function getNextWeekdayDate(weekday, fromDate){
  const d = new Date(fromDate || new Date());
  d.setHours(0,0,0,0);
  const diff = (weekday - d.getDay() + 7) % 7;
  d.setDate(d.getDate() + diff);
  return toLocalDateStr(d);
}

document.getElementById('saveTaskBtn').addEventListener('click', () => {
  const name = document.getElementById('inputName').value.trim();
  const categoryInput = document.querySelector('#categorySelect input:checked');
  const category = categoryInput ? categoryInput.value : 'work';
  const rankInput = document.querySelector('#rankSelect input:checked');
  const dateModeInput = document.querySelector('#dateModeSelect input:checked');
  const dateMode = dateModeInput ? dateModeInput.value : 'time';
  const planStart = document.getElementById('inputPlanStart').value;
  const planDurationMin = parseInt(document.getElementById('inputPlanDuration').value, 10);
  const dueDate = document.getElementById('inputDueDate').value;
  const repeatStartTime = document.getElementById('inputRepeatStartTime').value;
  const repeatDurationMin = parseInt(document.getElementById('inputRepeatDuration').value, 10);
  const memo = document.getElementById('inputMemo').value.trim();
  const repeatEnabled = document.getElementById('inputRepeatEnabled').checked;
  const weekdayInput = document.querySelector('#weekdaySelect input:checked');
  const isRepeatTimeMode = (dateMode === 'time' && repeatEnabled);

  if (!name){ alert('タスク名を入力してください'); return; }
  if (category === 'work' && !rankInput){ alert('優先順位を選択してください'); return; }
  if (dateMode === 'date' && !dueDate){ alert('期日を選択してください'); return; }
  if (repeatEnabled && !weekdayInput){ alert('繰り返しの曜日を選択してください'); return; }
  if (isRepeatTimeMode && !repeatStartTime){ alert('開始時刻を入力してください'); return; }

  const rank = category === 'private' ? 'P' : rankInput.value;
  const isNewTask = !currentEditId;
  const id = currentEditId || uid();
  const existing = tasks[id] || {};
  const weekday = repeatEnabled ? parseInt(weekdayInput.value, 10) : null;

  const data = Object.assign({}, existing, {
    name, rank, category,
    memo,
    repeatEnabled,
    repeatWeekday: weekday,
    repeatStartTime: isRepeatTimeMode ? repeatStartTime : null,
    done: existing.done || false,
    actualStart: existing.actualStart || null,
    actualEnd: existing.actualEnd || null,
    createdAt: existing.createdAt || new Date().toISOString()
  });

  if (isRepeatTimeMode) {
    // 繰り返し×時刻指定：日付は選択した曜日から自動算出し、時刻＋所要時間を反映
    let occurrenceDateStr;
    if (existing.planStart) {
      const existingDateStr = toLocalDateStr(new Date(existing.planStart));
      const existingWeekday = new Date(existingDateStr + 'T00:00:00').getDay();
      occurrenceDateStr = (existingWeekday === weekday) ? existingDateStr : getNextWeekdayDate(weekday);
    } else {
      occurrenceDateStr = getNextWeekdayDate(weekday);
    }
    const startDateTime = new Date(`${occurrenceDateStr}T${repeatStartTime}`);
    const endDateTime = new Date(startDateTime.getTime() + repeatDurationMin * 60000);
    const pad = n => n.toString().padStart(2,'0');
    data.repeatEndTime = `${pad(endDateTime.getHours())}:${pad(endDateTime.getMinutes())}`;
    data.planStart = startDateTime.toISOString();
    data.planEnd = endDateTime.toISOString();
    data.planDateOnly = null;
  } else {
    data.repeatEndTime = null;
    if (dateMode === 'time' && planStart) {
      const startDateTime = new Date(planStart);
      data.planStart = startDateTime.toISOString();
      data.planEnd = new Date(startDateTime.getTime() + planDurationMin * 60000).toISOString();
    } else {
      data.planStart = null;
      data.planEnd = null;
    }
    data.planDateOnly = (dateMode === 'date' && dueDate) ? dueDate : null;
  }

  saveTask(id, data);
  if (isNewTask && data.planEnd) {
    lastRegisteredAt = new Date();
    lastRegisteredPlanEnd = data.planEnd;
  }
  taskOverlay.classList.remove('show');
});

/* ---------- 今すぐ開始（実績開始時刻を現在時刻で記録） ---------- */
function startTaskNow(id){

/* ---------- 中止／中止取り消し（予定スケジュールは変更しない。完了率には未完了としてカウントされる） ---------- */
function setTaskCancelled(id, cancelled){
  const t = tasks[id];
  if (!t) return;
  const data = Object.assign({}, t, { cancelled });
  saveTask(id, data);
}

/* ---------- 繰り返しスケジュール：完了時に翌週分を自動登録 ---------- */
function createNextRecurrence(completedTask){
  const hasTimeRepeat = !!(completedTask.repeatStartTime && completedTask.repeatEndTime);
  const baseDateStr = completedTask.planDateOnly || (completedTask.planStart ? toLocalDateStr(new Date(completedTask.planStart)) : todayStr());
  const base = new Date(baseDateStr + 'T00:00:00');
  const next = new Date(base.getTime() + 7*24*60*60*1000);
  const nextDateStr = toLocalDateStr(next);
  const newId = uid();
  const newTask = {
    name: completedTask.name,
    rank: completedTask.rank,
    category: completedTask.category,
    memo: completedTask.memo || '',
    repeatEnabled: true,
    repeatWeekday: completedTask.repeatWeekday,
    repeatStartTime: completedTask.repeatStartTime || null,
    repeatEndTime: completedTask.repeatEndTime || null,
    done: false,
    actualStart: null,
    actualEnd: null,
    createdAt: new Date().toISOString()
  };
  if (hasTimeRepeat){
    newTask.planStart = new Date(`${nextDateStr}T${completedTask.repeatStartTime}`).toISOString();
    newTask.planEnd = new Date(`${nextDateStr}T${completedTask.repeatEndTime}`).toISOString();
    newTask.planDateOnly = null;
  } else {
    newTask.planStart = null;
    newTask.planEnd = null;
    newTask.planDateOnly = nextDateStr;
  }
  saveTask(newId, newTask);
}

/* ---------- ゲーミフィケーション ---------- */
function onTaskCompleted(before, after){
  const rank = after.rank;
  const points = RANK_POINT[rank] || 10;
  const onTime = after.planEnd ? (new Date(after.actualEnd) <= new Date(after.planEnd)) : true;

  stats.xp += points;
  stats.totalDone = (stats.totalDone || 0) + 1;
  if (onTime) stats.onTimeCount = (stats.onTimeCount || 0) + 1;
  if (rank === 'A') stats.rankADone = (stats.rankADone || 0) + 1;

  // レベル計算（レベルnに必要な累積XP = n*100）
  while (stats.xp >= stats.level * 100) {
    stats.level += 1;
  }

  // 連続達成日数（今日初めての完了なら更新）
  const today = todayStr();
  if (stats.lastDoneDate !== today) {
    const yest = new Date(); yest.setDate(yest.getDate()-1);
    const yestStr = toLocalDateStr(yest);
    stats.streak = (stats.lastDoneDate === yestStr) ? (stats.streak || 0) + 1 : 1;
    stats.lastDoneDate = today;
    stats.bestStreak = Math.max(stats.bestStreak || 0, stats.streak);
  }

  // バッジ判定
  let newBadge = null;
  BADGES.forEach(b => {
    if (!stats.badges) stats.badges = {};
    if (!stats.badges[b.id] && b.cond(stats)) {
      stats.badges[b.id] = true;
      newBadge = b;
    }
  });

  saveStats();
  fireConfetti();
  if (newBadge) {
    setTimeout(() => alert(`🏆 新しいバッジ獲得！\n${newBadge.emoji} ${newBadge.name}`), 400);
  }
}

/* ---------- 描画：応援バナー・達成率 ---------- */
function renderStats(){
  document.getElementById('levelNum').textContent = stats.level || 1;
  document.getElementById('streakNum').textContent = stats.streak || 0;
  const xpInLevel = stats.xp - ((stats.level-1) * 100);
  const xpNeeded = 100;
  document.getElementById('xpBar').style.width = Math.min(100, (xpInLevel/xpNeeded)*100) + '%';
  document.getElementById('xpText').textContent = `${xpInLevel} / ${xpNeeded} XP`;

  document.getElementById('statTotalDone').textContent = stats.totalDone || 0;
  const onTimePct = stats.totalDone ? Math.round((stats.onTimeCount||0)/stats.totalDone*100) : 0;
  document.getElementById('statOnTime').textContent = onTimePct + '%';
  document.getElementById('statBestStreak').textContent = stats.bestStreak || 0;

  const grid = document.getElementById('badgeGrid');
  grid.innerHTML = '';
  BADGES.forEach(b => {
    const unlocked = stats.badges && stats.badges[b.id];
    const el = document.createElement('div');
    el.className = 'badge' + (unlocked ? ' unlocked' : '');
    el.innerHTML = `<div class="b-emoji">${b.emoji}</div><div class="b-name">${b.name}</div>`;
    grid.appendChild(el);
  });
}

function renderList(){
  const list = document.getElementById('taskList');
  const emptyHint = document.getElementById('emptyHint');
  list.innerHTML = '';

  const now = new Date();
  const showCompleted = document.getElementById('showCompletedToggle').checked;

  const filteredTasks = Object.entries(tasks).filter(([id,t]) => {
    if (currentFilter !== 'ALL' && t.rank !== currentFilter) return false;
    if (!showCompleted && t.done) return false;
    return true;
  });

  emptyHint.style.display = filteredTasks.length ? 'none' : 'block';

  // 期日ごとにグループ化（日時未定は 'undecided' として一番上に固定）
  const groups = {};
  const groupKeyOf = (t) => {
    if (t.planStart) return toLocalDateStr(new Date(t.planStart));
    if (t.planDateOnly) return t.planDateOnly;
    return 'undecided';
  };
  filteredTasks.forEach(([id, t]) => {
    const key = groupKeyOf(t);
    if (!groups[key]) groups[key] = [];
    groups[key].push([id, t]);
  });

  const sortWithinGroup = (a, b) => {
    const aStart = a[1].planStart || '';
    const bStart = b[1].planStart || '';
    if (aStart !== bStart) return aStart.localeCompare(bStart);
    const aEnd = a[1].planEnd || '';
    const bEnd = b[1].planEnd || '';
    return aEnd.localeCompare(bEnd);
  };
  Object.values(groups).forEach(arr => arr.sort(sortWithinGroup));

  const sortedKeys = Object.keys(groups).sort((a, b) => {
    if (a === 'undecided') return -1;
    if (b === 'undecided') return 1;
    return a.localeCompare(b);
  });

  const todayStrVal = todayStr();
  const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate() + 1);
  const tomorrowStr = toLocalDateStr(tomorrow);
  const weekdayLabels = ['日','月','火','水','木','金','土'];

  function formatGroupHeader(key){
    if (key === 'undecided') return { text: '❔ 日時未定', badge: '' };
    const d = new Date(key + 'T00:00:00');
    const text = `📅 ${d.getMonth()+1}/${d.getDate()}(${weekdayLabels[d.getDay()]})`;
    let badge = '';
    if (key === todayStrVal) badge = '<span class="badge-today">今日</span>';
    else if (key === tomorrowStr) badge = '<span class="badge-tomorrow">明日</span>';
    else if (key < todayStrVal) badge = '<span class="badge-overdue">期限超過</span>';
    return { text, badge };
  }

  sortedKeys.forEach(key => {
    const header = document.createElement('div');
    header.className = 'date-group-header';
    const { text, badge } = formatGroupHeader(key);
    header.innerHTML = `<span>${text}</span>${badge}`;
    list.appendChild(header);

    groups[key].forEach(([id, t]) => {
      const row = document.createElement('div');
      const isOverdue = !t.done && !t.cancelled && (
        (t.planEnd && new Date(t.planEnd) < now) ||
        (t.planDateOnly && new Date(t.planDateOnly + 'T23:59:59') < now)
      );
      const isUndated = !t.planStart && !t.planDateOnly;
      const isInProgress = !t.done && !t.cancelled && !!t.actualStart;
      row.className = 'task-row' + (isOverdue ? ' row-overdue' : '') + (isUndated ? ' row-undated' : '') + (isInProgress ? ' row-inprogress' : '') + (t.cancelled ? ' row-cancelled' : '');
      let planTxt;
      if (t.planStart) planTxt = `${fmtTime(t.planStart)}〜${fmtTime(t.planEnd)}`;
      else if (t.planDateOnly) planTxt = `期日 ${fmtDateOnly(t.planDateOnly)}`;
      else planTxt = '日時未定';
      const actualTxt = t.done ? `実績 ${fmtTime(t.actualStart)}〜${fmtTime(t.actualEnd)}`
        : (t.cancelled ? '🚫 中止' : (isInProgress ? `⏱ ${fmtTime(t.actualStart)}〜 実行中` : ''));
      const memoHtml = t.memo ? `<div class="task-memo">${linkifyMemo(t.memo)}</div>` : '';
      row.innerHTML = `
        <div class="rank-badge" style="background:${RANK_BG[t.rank]};color:${RANK_COLOR[t.rank]}">${t.rank === 'P' ? '🏠' : (t.rank === 'D' ? '📝' : t.rank)}</div>
        <div class="task-main">
          <div class="task-name ${t.done?'done':''} ${t.cancelled?'cancelled':''}">${t.repeatEnabled ? '🔁 ' : ''}${escapeHtml(t.name)}</div>
          <div class="task-meta">予定 ${planTxt}${actualTxt ? ' ／ ' + actualTxt : ''}</div>
          ${memoHtml}
        </div>
        <div class="task-actions">
          ${(!t.done && !t.cancelled && !t.actualStart) ? `<button class="icon-btn start-btn" title="今すぐ開始">▶</button>` : ``}
          ${(!t.done && !t.cancelled) ? `<button class="icon-btn done-btn" title="実績記録">✓</button>` : ``}
          ${t.done ? `<button class="icon-btn done-btn" title="実績編集">📝</button>` : ``}
          ${(!t.done && !t.cancelled) ? `<button class="icon-btn cancel-btn" title="中止にする">✕</button>` : ``}
          ${(!t.done && t.cancelled) ? `<button class="icon-btn resume-btn" title="中止を取り消す">↩</button>` : ``}
          <button class="icon-btn del-btn" title="削除">🗑</button>
        </div>
      `;
      const startBtn = row.querySelector('.start-btn');
      const doneBtn = row.querySelector('.done-btn');
      const cancelBtn = row.querySelector('.cancel-btn');
      const resumeBtn = row.querySelector('.resume-btn');
      const delBtn = row.querySelector('.del-btn');
      if (startBtn) startBtn.addEventListener('click', (e) => { e.stopPropagation(); startTaskNow(id); });
      if (doneBtn) doneBtn.addEventListener('click', (e) => { e.stopPropagation(); openActualModal(id); });
      if (cancelBtn) cancelBtn.addEventListener('click', (e) => { e.stopPropagation(); setTaskCancelled(id, true); });
      if (resumeBtn) resumeBtn.addEventListener('click', (e) => { e.stopPropagation(); setTaskCancelled(id, false); });
      delBtn.addEventListener('click', (e) => { e.stopPropagation(); deleteTask(id); });
      row.addEventListener('click', () => { currentEditId = id; openEditModal(t); });
      list.appendChild(row);
    });
  });

  // 今日の達成率（分母は「期日が今日」のA〜Cランクのみ。日時未定・備忘・プライベートは対象外。ガントチャートには表示されます。表示/非表示トグルの影響は受けません）
  const todayKey = todayStr();
  const achievementTasks = Object.values(tasks).filter(t => {
    if (!isAchievementRank(t.rank)) return false;
    const dateKey = t.planStart ? toLocalDateStr(new Date(t.planStart)) : (t.planDateOnly || null);
    return dateKey === todayKey;
  });
  const total = achievementTasks.length;
  const done = achievementTasks.filter(t => t.done).length;
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById('dayRing').style.setProperty('--pct', pct);
  document.getElementById('dayPct').textContent = pct + '%';
  document.getElementById('doneCount').textContent = done;
  document.getElementById('totalCount').textContent = total;

  // 応援メッセージ
  let bucket = 'zero';
  if (pct >= 100 && total > 0) bucket = 'all';
  else if (pct >= 70) bucket = 'most';
  else if (pct >= 40) bucket = 'half';
  else if (pct > 0) bucket = 'some';
  const msgs = ENCOURAGE_MSGS[bucket];
  document.getElementById('encourageText').textContent = msgs[Math.floor(Math.random()*msgs.length)];
  document.querySelector('.encourage-banner .emoji').textContent = bucket === 'all' ? '🎉' : (bucket === 'most' ? '🚀' : (bucket === 'half' ? '💪' : '✨'));
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

/* メモ内のURLをタップ可能なリンクに変換 */
function linkifyMemo(memo){
  const urlRegex = /(https?:\/\/[^\s]+)/g;
  const parts = memo.split(urlRegex);
  return parts.map(part => {
    if (/^https?:\/\//.test(part)) {
      const safeUrl = escapeHtml(part);
      return `<a href="${safeUrl}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">${safeUrl}</a>`;
    }
    return escapeHtml(part);
  }).join('');
}

/* ---------- ガントチャート描画 ---------- */
document.getElementById('ganttDate').addEventListener('change', renderGantt);

function renderGantt(){
  const dateInput = document.getElementById('ganttDate');
  if (!dateInput.value) dateInput.value = todayStr();
  const targetDate = dateInput.value;

  const hoursWrap = document.getElementById('ganttHours');
  hoursWrap.innerHTML = '';
  for (let h = 0; h < 24; h += 2){
    const el = document.createElement('div');
    el.className = 'gantt-hour';
    el.style.flex = '2';
    el.textContent = h + '時';
    hoursWrap.appendChild(el);
  }

  const namesWrap = document.getElementById('ganttNames');
  const body = document.getElementById('ganttBody');
  namesWrap.innerHTML = '';
  body.innerHTML = '';

  const dayTasks = Object.entries(tasks).filter(([id, t]) => {
    const d = t.planStart ? toLocalDateStr(new Date(t.planStart)) : (t.planDateOnly ? t.planDateOnly : (t.actualStart ? toLocalDateStr(new Date(t.actualStart)) : null));
    return d === targetDate;
  }).sort((a,b) => (a[1].planStart||'').localeCompare(b[1].planStart||''));

  document.getElementById('ganttEmptyHint').style.display = dayTasks.length ? 'none' : 'block';

  function pctOfDay(iso){
    const d = new Date(iso);
    return ((d.getHours()*60 + d.getMinutes()) / (24*60)) * 100;
  }

  dayTasks.forEach(([id, t]) => {
    const nameRow = document.createElement('div');
    nameRow.className = 'gantt-name-row';
    nameRow.title = t.name;
    nameRow.textContent = t.name;
    namesWrap.appendChild(nameRow);

    const row = document.createElement('div');
    row.className = 'gantt-row';
    const color = RANK_COLOR[t.rank] || '#999';

    let planBarHtml = '';
    if (t.planStart && t.planEnd){
      const left = pctOfDay(t.planStart);
      const width = Math.max(1, pctOfDay(t.planEnd) - left);
      planBarHtml = `<div class="bar bar-plan" style="left:${left}%;width:${width}%;border-color:${color};"></div>`;
    } else if (t.planDateOnly){
      planBarHtml = `<div class="bar bar-plan" style="left:0%;width:100%;border-color:${color};"></div>`;
    }
    let actualBarHtml = '';
    if (t.actualStart && t.actualEnd){
      const left = pctOfDay(t.actualStart);
      const width = Math.max(1, pctOfDay(t.actualEnd) - left);
      actualBarHtml = `<div class="bar actual" style="left:${left}%;width:${width}%;background:${color};"></div>`;
    }

    row.innerHTML = `<div class="gantt-track">${planBarHtml}${actualBarHtml}</div>`;
    body.appendChild(row);
  });
}

/* ---------- 達成演出：簡易紙吹雪 ---------- */
function fireConfetti(){
  const canvas = document.getElementById('confettiCanvas');
  canvas.style.display = 'block';
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const ctx = canvas.getContext('2d');
  const colors = ['#FF945A', '#4CAF87', '#F0A93E', '#E85D5D', '#6C8CB0'];
  const particles = Array.from({length: 80}, () => ({
    x: Math.random()*canvas.width,
    y: -20 - Math.random()*200,
    r: 4 + Math.random()*5,
    c: colors[Math.floor(Math.random()*colors.length)],
    vy: 2 + Math.random()*3,
    vx: -1.5 + Math.random()*3,
    rot: Math.random()*360
  }));
  let frame = 0;
  function tick(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach(p => {
      p.y += p.vy; p.x += p.vx; p.rot += 6;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * Math.PI/180);
      ctx.fillStyle = p.c;
      ctx.fillRect(-p.r/2, -p.r/2, p.r, p.r*1.6);
      ctx.restore();
    });
    frame++;
    if (frame < 90) requestAnimationFrame(tick);
    else { canvas.style.display = 'none'; ctx.clearRect(0,0,canvas.width,canvas.height); }
  }
  tick();
}
